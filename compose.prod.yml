# Production override for the maintainer's app-scoped rollout (issue #96).
#
# The portable baseline (compose.yml) publishes to loopback and uses the
# project-default network. Production instead fronts the broker with a reverse
# proxy running in its OWN stack, which reaches the broker over a shared,
# stably-named Docker network. Apply it explicitly on top of the baseline:
#
#     docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# scripts/deploy applies both files by default. This override stays
# proxy-agnostic: it wires the shared-network seam only and prescribes no proxy
# product, domain, or address. See docs/deploy.md.
services:
  omxterm-web:
    # Production keeps the pre-#101 `always` policy (commit 4744e08): the broker
    # must come back after daemon restarts/reboots even if it was manually
    # stopped before them. The portable baseline stays `unless-stopped` so a
    # self-hoster's deliberate `docker stop` sticks across reboots (issue #108).
    restart: always
    # The host firewall allows this exact source address to SSH back into the
    # host for the self-target demo. Keep it outside the edge network's dynamic
    # 10.210.0.128/25 pool so every forced recreate preserves the rule match.
    networks:
      edge:
        ipv4_address: 10.210.0.10

networks:
  edge:
    name: omxterm-web-edge
    external: true
