name: Feature request
description: Suggest an enhancement for OMXTerm Web
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        OMXTerm Web is a small, scope-locked MVP. Features outside
        `docs/prd-mvp-web-ssh-terminal.md` require updating the PRD first.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What pain or use case does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope check
      description: Is this within the MVP PRD? If not, what PRD change does it require?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
