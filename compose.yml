# Portable, safe-by-default Compose baseline for self-hosters (issue #96).
#
# A fresh clone with a valid local .env starts with a single command:
#
#     docker compose up -d --build
#
# It needs no pre-created network, no fixed container address, and no specific
# reverse-proxy product, domain, or host path. The broker publishes ONLY to
# loopback (127.0.0.1:3000 on the host), so it is never exposed on every
# interface by accident. Put any HTTPS reverse proxy you like in front of it and
# forward to http://127.0.0.1:3000 — see docs/deploy.md.
#
# Secrets and origin come from a local .env (git-ignored, never committed).
#
# The maintainer's app-scoped production rollout (a reverse proxy in its own
# stack, reached over a shared Docker network) layers compose.prod.yml on top:
#
#     docker compose -f compose.yml -f compose.prod.yml up -d --build
services:
  omxterm:
    build: .
    # Deliberately no container_name: a fixed name is daemon-global, so a fresh
    # clone would collide with any other OMXTerm container already on the host
    # (e.g. the maintainer's deployment) and could not `docker compose up`
    # alongside it — defeating Compose's per-project isolation. Left unset,
    # Compose derives a project-scoped name, and the service name `omxterm` stays
    # a network alias, so an in-network proxy still reaches http://omxterm:3000
    # (see compose.prod.yml and docs/deploy.md).
    # `unless-stopped` (not `always`) so a self-hoster's deliberate `docker stop`
    # sticks across daemon restarts/reboots. The maintainer's production rollout
    # overrides this to `always` in compose.prod.yml (issue #108).
    restart: unless-stopped
    env_file: .env
    # `environment:` here wins over `env_file:` for the same key (Compose
    # precedence), so this pins the container's bind address regardless of what
    # OMXTERM_SERVER_HOST is set to in .env. .env.example ships
    # OMXTERM_SERVER_HOST=127.0.0.1 (the right default for local `npm run dev`,
    # which runs the broker directly on the host), and a fresh clone's .env is
    # typically copied straight from it — without this override, that value
    # would leak into the container via env_file and make the broker bind its
    # own loopback, unreachable from Docker's published port or an in-network
    # proxy even though ports below still publish correctly.
    environment:
      OMXTERM_SERVER_HOST: "0.0.0.0"
    # Host side pinned to loopback so the broker is reachable only through a
    # reverse proxy you deliberately place in front of it, not on the LAN or the
    # public internet.
    ports:
      - "127.0.0.1:3000:3000"
