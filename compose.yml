# Compose descriptor for the OMXTerm broker. It runs as a single container that
# you place behind a reverse proxy terminating TLS (see docs/deploy.md). Secrets
# and origin come from a local .env (git-ignored, never committed).
#
# A portable, safe-by-default baseline — loopback-bound publishing and a
# reverse-proxy-agnostic topology — is tracked in #96; keep any deployment-
# specific network, address, or edge wiring in a local override, not here.
services:
  omxterm:
    build: .
    container_name: omxterm
    restart: always
    env_file: .env
