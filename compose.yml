# Deploy descriptor for the VPS. The broker runs as a single container behind a
# shared, pre-existing Traefik (file provider) on the external `read_inprod_web`
# network. Routing/TLS/basicAuth live in that Traefik's dynamic.yml — see
# docs/deploy.md. Secrets come from a local .env (not committed).
services:
  omxterm:
    build: .
    container_name: omxterm
    restart: unless-stopped
    env_file: .env
    networks:
      # Pinned so the host firewall can allow-list this container's own
      # address for SSH (self-target demo); a floating IP would silently
      # drift on the next recreate and the allow rule would stop matching.
      web:
        ipv4_address: 172.16.1.2

networks:
  web:
    name: read_inprod_web
    external: true
